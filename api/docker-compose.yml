services:
  postgres:
    image: postgres:16-alpine
    container_name: furkansogutma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: furkansogutma
      POSTGRES_USER: furkansogutma
      POSTGRES_PASSWORD: furkansogutma
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - furkansogutma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U furkansogutma -d furkansogutma']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: furkansogutma-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - furkansogutma_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  furkansogutma_postgres_data:
  furkansogutma_redis_data:
