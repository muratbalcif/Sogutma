name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy started
        run: echo "Deploy started"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "${PRODUCTION_HOST}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Verify host key (do not disable StrictHostKeyChecking).
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Connected to production VPS
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${PRODUCTION_HOST}"
          test -n "${PRODUCTION_USER}"
          test -n "${SSH_AUTH_SOCK}"
          # Agent-only auth (same as Test VPS Connection). Do not write private key to disk.
          ssh \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ChallengeResponseAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o IdentityAgent="${SSH_AUTH_SOCK}" \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            'echo "Connected to production VPS ($(hostname))" && echo SSH_CONNECTION_OK'

      - name: Deploy to VPS
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${PRODUCTION_HOST}"
          test -n "${PRODUCTION_USER}"
          test -n "${SSH_AUTH_SOCK}"
          # .env.production stays on the VPS only. Never echo secrets / keys.
          # Pull first so this commit's scripts/deploy-production.sh runs, then --post-pull.
          # VPS steps (via scripts/deploy-production.sh --post-pull):
          #   compose config validate → postgres/redis up → prisma migrate deploy
          #   → docker compose up -d --build → container + loopback health (3100/3101/3102)
          ssh \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ChallengeResponseAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o IdentityAgent="${SSH_AUTH_SOCK}" \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            'set -Eeuo pipefail
             cd /opt/furkansogutma
             echo "Repository updated (fetch/reset)"
             PREV="$(git rev-parse HEAD)"
             git fetch origin
             git checkout main
             git reset --hard origin/main
             NEW="$(git rev-parse HEAD)"
             echo "Current SHA: ${PREV}"
             echo "Deploy SHA: ${NEW}"
             bash scripts/deploy-production.sh --post-pull'

      - name: Health verification (public)
        run: |
          set -Eeuo pipefail
          echo "Checking API…"
          curl -fsS --max-time 20 https://api.furkansogutma.net/api/v1/health >/dev/null
          echo "Checking Web…"
          curl -fsSI --max-time 20 https://www.furkansogutma.net >/dev/null
          echo "Checking Admin…"
          curl -fsSI --max-time 20 https://admin.furkansogutma.net >/dev/null
          echo "Deploy completed successfully"
