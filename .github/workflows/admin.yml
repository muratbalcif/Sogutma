name: Admin CI

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
      - 'package-lock.json'
  push:
    branches: [main, master]
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Admin has no test:e2e script yet — keep CI green with lint+build.
      - name: Note
        run: echo "admin test:e2e not configured; lint+build only"
