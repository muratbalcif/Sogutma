name: Admin CI

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
      - 'package-lock.json'
  push:
    branches: [main, master]
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Admin UI smoke e2e (guest guards). Authenticated RBAC is covered by API e2e.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
