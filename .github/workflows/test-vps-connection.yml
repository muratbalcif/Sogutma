name: Test VPS Connection

# Temporary SSH diagnosis: verify PRODUCTION_SSH_PRIVATE_KEY fingerprint + publickey auth.
# Never logs private key material.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-vps-connection:
    name: Test VPS Connection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}

      - name: Diagnose agent fingerprint
        id: fingerprint
        run: |
          set -Eeuo pipefail
          EXPECTED='SHA256:QCtekeNIoUtrbjUHnjwnbhDzB/LbvIcHD+2W8pxJHs4'

          echo "Agent keys (ssh-add -l — fingerprints only, never private key material):"
          ssh-add -l

          AGENT_FPS="$(ssh-add -l -E sha256 2>/dev/null || ssh-add -l)"
          echo "EXPECTED_FINGERPRINT=${EXPECTED}"

          if printf '%s\n' "$AGENT_FPS" | grep -Fq "$EXPECTED"; then
            echo "FINGERPRINT_MATCH=YES"
            echo "match=yes" >> "$GITHUB_OUTPUT"
          else
            echo "FINGERPRINT_MATCH=NO"
            echo "match=no" >> "$GITHUB_OUTPUT"
            echo "::error::PRODUCTION_SSH_PRIVATE_KEY fingerprint does not match expected ${EXPECTED}."
            exit 1
          fi

      - name: Add VPS to known_hosts
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          set -Eeuo pipefail
          test -n "${PRODUCTION_HOST}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Keep host key verification enabled.
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: SSH publickey connection test
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${PRODUCTION_HOST}"
          test -n "${PRODUCTION_USER}"
          test -n "${SSH_AUTH_SOCK}"

          # Do NOT use IdentitiesOnly=yes with agent-only auth: OpenSSH then ignores
          # ssh-agent identities unless IdentityFile is also set (which would require
          # writing the private key to disk). IdentityAgent + publickey-only options
          # force pubkey via the agent with no password fallback.
          echo "Connecting as ${PRODUCTION_USER}@${PRODUCTION_HOST} (publickey via ssh-agent)…"
          ssh \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o ChallengeResponseAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o IdentityAgent="${SSH_AUTH_SOCK}" \
            -o NumberOfPasswordPrompts=0 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            'echo SSH_CONNECTION_OK'

          echo "SSH publickey connection succeeded."

      - name: Summary
        if: always()
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          set -Eeuo pipefail
          echo "VPS_HOST=${PRODUCTION_HOST}"
          echo "VPS_USER=${PRODUCTION_USER}"
          echo "EXPECTED_FINGERPRINT=SHA256:QCtekeNIoUtrbjUHnjwnbhDzB/LbvIcHD+2W8pxJHs4"
          echo "FINGERPRINT_MATCH=${{ steps.fingerprint.outputs.match }}"
          echo "Auth: PreferredAuthentications=publickey, PasswordAuthentication=no (via ssh-agent)"
          echo "If fingerprint matched but SSH failed: check VPS authorized_keys / sshd AllowUsers / Match blocks."
