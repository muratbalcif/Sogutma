[package]
name = "furkansogutma-pos"
version = "1.0.0"
description = "FurkanSoğutma Windows POS"
authors = ["FurkanSoğutma"]
edition = "2021"

[lib]
name = "furkansogutma_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
